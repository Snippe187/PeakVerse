name: PeakCore
version: '${version}'
main: de.peakverse.core.plugin.PeakCorePlugin
api-version: '26.2'
description: "PeakVerse: Basis (API, Kanal zur Mod) und eingebaute Module (PeakSound, spaeter TexturePeak)."
softdepend: [voicechat]
commands:
  peakweb:
    description: Link zur PeakVerse-Web-Oberflaeche (fuer Rollen mit Web-Zugang)
    usage: /peakweb
  peakcore:
    description: Version, Module, Kanal-Status und Spieler mit Mod von PeakCore
    usage: /peakcore <version|modules|status|players>
    permission: peakcore.admin
  peaksound:
    description: PeakSound-Diagnose fuer Operatoren
    usage: /peaksound <eqtest|place|play> ...
    permission: peaksound.admin
  texturepeak:
    description: TexturePeak verwalten (Texturen-Regeln, Archiv, Pack)
    usage: /texturepeak <list|add|remove|archive|restore|apply|check|reload>
    permission: peakcore.admin
  peakachievements:
    description: Achievements ansehen und verwalten
    usage: /peakachievements <me|list|info|give|revoke|enable|disable|add|remove|reload>
    aliases: [ach]
  peakenchants:
    description: Verzauberungen (Datapack-Addon) ansehen und vergeben
    usage: /peakenchants <list|info|book|apply>
    permission: peakcore.admin
    aliases: [pench]
  peaksoundvote:
    description: Abstimmen, den laufenden Song der Jukebox in deiner Naehe zu ueberspringen
    usage: /peaksoundvote
  board:
    description: Die Anzeige rechts (PeakBoard) fuer dich ein- oder ausschalten
    usage: /board
permissions:
  peakboard.toggle:
    description: Die Anzeige rechts (PeakBoard) fuer sich selbst ein- und ausschalten
    default: true
  peakcore.admin:
    description: PeakCore-Befehle und Verwaltung
    default: op
  peaksound.upload:
    description: Eigene Songs hochladen
    default: true
  peaksound.library:
    description: Song-Bibliothek benutzen (suchen, Favoriten, auf Platte schreiben)
    default: true
  peaksound.library.manage.own:
    description: Eigene Songs umbenennen und loeschen
    default: true
  peaksound.library.manage.any:
    description: Fremde Songs umbenennen und loeschen
    default: op
  peaksound.queue:
    description: Songs wuenschen (Wunsch-Warteschlange)
    default: true
  peaksound.vote:
    description: Bei der Skip-Abstimmung mitmachen
    default: true
  peaksound.place:
    description: PeakSound-Bloecke setzen
    default: true
  peaksound.radio:
    description: Taschenradio benutzen
    default: true
  peaksound.limit.unlimited:
    description: Kein Songlimit beim Hochladen
    default: false
  peaksound.admin:
    description: Zugriff auf PeakSound-Diagnosebefehle
    default: op
# Werden von Paper beim ersten Start von Maven Central geladen (eigene Jars, LGPL bleibt austauschbar).
libraries:
  - net.jthink:jaudiotagger:3.0.1
  - com.googlecode.soundlibs:jlayer:1.0.1.4
  - org.jcraft:jorbis:0.0.17
  - org.jflac:jflac-codec:1.5.2
  - net.sourceforge.javaflacencoder:java-flac-encoder:0.3.7


